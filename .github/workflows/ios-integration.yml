name: iOS Integration Dependency Tests

on:
  push:
    branches:
      - ios-integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: true

      - name: Test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...
